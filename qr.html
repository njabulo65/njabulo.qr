<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Njabulo JB · QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Outfit", sans-serif;
            background: linear-gradient(-45deg, #4a90e2, #3ac569, #9b59b6, #e74c3c);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #content {
            display: flex;
            flex-direction: column;
            width: 22rem;
            text-align: center;
            background-color: #000000;
            padding: 1rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #QR-content img {
            border-radius: 10px;
            width: 100%;
            max-width: 20rem;
            min-height: 20rem;
            background: white;
        }

        #title-container {
            padding: 1rem 1rem 0 1rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        #description-container {
            padding: 0 2rem;
            color: #fff;
            margin-bottom: 2rem;
        }

        .legend {
            color: #fff;
            font-size: 1em;
            margin-top: 0.5em;
            margin-bottom: 1em;
        }

        progress {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            accent-color: #3ac569;
        }

        .reload-button {
            display: inline-block;
            padding: 12px 20px;
            background-color: #3498db;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .reload-button:hover {
            background-color: #2980b9;
        }
    </style>
    <script>
        var timeleft = 30;
        var downloadTimer = setInterval(function () {
            if (timeleft <= 0) {
                clearInterval(downloadTimer);
                document.getElementById("progressBar").remove();
                document.getElementById("main").innerHTML = "QR Expired!";
                document.getElementById("legend").innerHTML = "Please click reload below.";
            } else {
                document.getElementById("progressBar").value = 30 - timeleft;
            }
            timeleft -= 1;
        }, 1000);
    </script>
</head>
<body>
    <div id="content">
        <div id="QR-content">
            <!-- This pulls the PNG image from the server -->
            <img id="qr-image" src="/server" alt="Loading QR...">
        </div>
        <div id="title-container">
            <h2 id="main">NJABULO-JB QR</h2>
            <p class="legend" id="legend">Scan The QR Code</p>
        </div>
        <div id="description-container">
            <p id="semi" class="legend"></p>
            <progress value="0" max="30" id="progressBar"></progress>
        </div>
        <a href="javascript:history.go(0)" class="reload-button">Reload Page</a>
    </div>
</body>
</html>
